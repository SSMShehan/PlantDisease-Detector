name: plant_disease_detector
description: "AI-powered crop disease identification app for Sri Lankan farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^18.0.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.5.0

  # Persistence
  shared_preferences: ^2.2.3

  # Camera & Image Handling
  image_picker: ^1.1.2
  image_cropper: ^9.1.0

  # Network
  connectivity_plus: ^6.0.3

  # Animations
  lottie: ^3.3.1

  # UI Components
  percent_indicator: ^4.2.4

  # Fonts
  google_fonts: ^6.2.1

  # Localization
  intl: ^0.20.2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/images/
